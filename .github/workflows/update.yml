name: Mise a jour du tableau de bord

on:
  schedule:
    - cron: '0 5 * * *'      # 07h00 heure de Paris : le bilan de la veille
    - cron: '0 19 * * *'     # 21h00 heure de Paris : la seance du jour
  workflow_dispatch:          # bouton "Run workflow" dans l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recuperer les donnees Intervals.icu
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
        run: python scripts/fetch_data.py

      - name: Regenerer le plan et la page
        run: |
          python scripts/build_plan.py
          python scripts/build_site.py

      - name: Publier si quelque chose a change
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet && echo "Aucun changement." && exit 0
          git commit -m "Donnees du $(date +'%d/%m/%Y')"
          git push
