<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Variante de favicon.svg pour l'ecran d'accueil : fond plein jusqu'aux
       bords (Android et iOS decoupent eux-memes la forme de l'icone) et
       dessin ramene a 80 % au centre, dans la zone que les masques ne
       rognent jamais. -->
  <rect width="100" height="100" fill="#1d1d1f"/>
  <g transform="translate(50 50) scale(.8) translate(-50 -50)">
    <g fill="#2997ff">
      <path d="M50 50A21 21 0 0 1 50 20A21 21 0 0 1 50 50Z"/>
      <path d="M50 50A21 21 0 0 1 50 20A21 21 0 0 1 50 50Z" transform="rotate(90 50 50)"/>
      <path d="M50 50A21 21 0 0 1 50 20A21 21 0 0 1 50 50Z" transform="rotate(180 50 50)"/>
      <path d="M50 50A21 21 0 0 1 50 20A21 21 0 0 1 50 50Z" transform="rotate(270 50 50)"/>
    </g>
    <g fill="#636366">
      <circle cx="67.68" cy="32.32" r="4.2"/><circle cx="67.68" cy="67.68" r="4.2"/>
      <circle cx="32.32" cy="67.68" r="4.2"/><circle cx="32.32" cy="32.32" r="4.2"/>
    </g>
    <circle cx="50" cy="50" r="5.2" fill="#ffffff"/>
  </g>
</svg>
